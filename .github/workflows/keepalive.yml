name: Réveil Supabase

# Un projet Supabase gratuit se met en pause après une semaine sans activité.
# Deux petites lectures par semaine (les totaux publics de l'accueil) le gardent éveillé,
# même quand personne ne joue.
on:
  schedule:
    - cron: "41 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lire les totaux publics
        env:
          # Clé publique du site (la même que dans site/js/online.js), faite pour être visible.
          SUPABASE_URL: https://jzzpyknxuueiynyugiox.supabase.co
          SUPABASE_KEY: sb_publishable_nMWd8aKhXrnJjy5JSLam0A_QUnMHVKH
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/live_stats" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" \
            -d "{\"day_key\": \"$(date -u +%F)\"}"
          echo
