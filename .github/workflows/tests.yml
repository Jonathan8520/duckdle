name: Tests

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - "supabase/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Pipeline de données
        run: python -m unittest discover -s pipeline -v

      - name: Syntaxe du JavaScript
        run: for f in site/js/*.js site/sw.js; do node --check "$f"; done

      - name: Cohérence du site
        run: node scripts/check-site.mjs

      - name: Synchronisation des comptes
        run: node tests/sync.test.mjs

      - name: Base de données (Postgres local, imitation de Supabase)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "create database duck"
          sudo -u postgres psql -q -d duck < tests/supabase-stub.sql
          for f in supabase/migrations/*.sql; do sudo -u postgres psql -q -d duck -v ON_ERROR_STOP=1 --single-transaction < "$f"; done
          sudo -u postgres psql -q -d duck -v ON_ERROR_STOP=1 < tests/supabase.test.sql
