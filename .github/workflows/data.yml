name: Données Inducks

# Chaque lundi, on récupère l'export public d'Inducks, on reconstruit les modes de jeu,
# on prolonge le calendrier des défis du jour, puis on redéploie le site si quelque chose a changé.
on:
  schedule:
    - cron: "17 4 * * 1"
  # Une modification du pipeline reconstruit aussitôt les données.
  push:
    branches: [main]
    paths:
      - "pipeline/build_data.py"
      - ".github/workflows/data.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Enregistrer et publier les données (sinon : essai à blanc, données en artefact)"
        type: boolean
        default: true
      force:
        description: "Publier même si le jeu rétrécit beaucoup d'un coup (changement voulu)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Tests du pipeline
        run: python -m unittest discover -s pipeline -v

      - name: Télécharger l'export Inducks
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 30 \
            --user-agent "duckdle/1.0 (+https://github.com/${{ github.repository }})" \
            --output isv.tgz https://inducks.org/inducks/isv.tgz
          ls -lh isv.tgz

      - name: Construire les données
        run: python pipeline/build_data.py --archive isv.tgz --out site/data ${{ inputs.force && '--force' || '' }}

      # Avant d'enregistrer quoi que ce soit : des données cassées sur main bloqueraient
      # ensuite tous les déploiements, corrections du site comprises.
      - name: Vérifier les données
        run: node scripts/check-site.mjs

      - name: Garder les données de l'essai à blanc
        # inputs.publish n'existe qu'au lancement manuel : ailleurs, on publie toujours.
        # Lancé depuis une autre branche que main, c'est toujours un essai à blanc.
        if: github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
        uses: actions/upload-artifact@v7
        with:
          name: donnees
          path: site/data
          retention-days: 3

      - name: Garder l'export Inducks de l'essai à blanc
        # Pour rejouer le pipeline hors de GitHub sur exactement les mêmes données.
        if: github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
        uses: actions/upload-artifact@v7
        with:
          name: export-inducks
          path: isv.tgz
          compression-level: 0
          retention-days: 1

      - name: Enregistrer les données
        id: commit
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        run: |
          git config user.name "Jonathan Levy"
          git config user.email "jonathan.levy2@etu.univ-paris1.fr"
          git add site/data
          if git diff --cached --quiet; then
            echo "Aucun changement."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit --quiet -m "data: mise à jour Inducks du $(date -u +%F)"
          # Quelqu'un a pu pousser sur main pendant la construction : on se remet par-dessus.
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
